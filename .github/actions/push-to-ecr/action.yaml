name: "Push Image to ECR"
description: "Tag a local Docker image and push it to Amazon ECR"

inputs:
  local-image:
    description: "Local Docker image to publish"
    required: true

  image-tag:
    description: "ECR image tag"
    required: true

  repository:
    description: "ECR repository name"
    required: true

  aws-region:
    description: "AWS region"
    required: true

  role-to-assume:
    description: "AWS IAM role used through GitHub OIDC"
    required: true

outputs:
  image-uri:
    description: "Published ECR image URI"
    value: ${{ steps.image.outputs.image-uri }}

runs:
  using: "composite"

  steps:
    # ------------------------------------------------------------------------
    # AWS Authentication
    # ------------------------------------------------------------------------

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c #v6.2.3
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}
        disable-retry: true


    # ------------------------------------------------------------------------
    # ECR Login
    # ------------------------------------------------------------------------

    - name: Login to Amazon ECR
      id: ecr-login
      uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd #v2.1.7

    - name: Tag image
      id: image
      shell: bash
      env:
        LOCAL_IMAGE: ${{ inputs.local-image }}
        REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        REPOSITORY: ${{ inputs.repository }}
        IMAGE_TAG: ${{ inputs.image-tag }}
      run: |
        set -euo pipefail

        IMAGE_URI="${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}"
        echo "$IMAGE_URI"
        docker tag \
          "$LOCAL_IMAGE" \
          "$IMAGE_URI"

        echo "image-uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

    - name: Push image
      shell: bash
      env:
        IMAGE_URI: ${{ steps.image.outputs.image-uri }}
      run: |
        set -euo pipefail

        docker push "$IMAGE_URI"