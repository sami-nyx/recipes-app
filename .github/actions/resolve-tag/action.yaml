name: "Resolve next tag"
description: "Resolve the next semantic version tag from repository tags"

inputs:
  major-minor-patch:
    description: "Version increment type: major, minor, or patch"
    required: false
    default: "patch"

outputs:
  NEXT_TAG:
    description: "Resolved next semantic version tag"
    value: ${{ steps.resolve.outputs.NEXT_TAG }}
  
  LATEST_TAG:
    description: "Resolved latest semantic version tag"
    value: ${{ steps.resolve.outputs.LATEST_TAG }}

runs:
  using: "composite"

  steps:
    - name: Resolve next tag
      id: resolve
      shell: bash
      run: |
        set -euo pipefail

        git fetch --tags --force

        # `git tag -l` only supports globs, not regex - its 'v[0-9]*.[0-9]*.[0-9]*'
        # pattern is looser than it looks (the trailing `*` matches a
        # suffix too, e.g. "v1.0.0-hotfix"), so filter again with a strict
        # anchored regex before picking the latest - a single stray tag
        # that only satisfies the glob would otherwise become LATEST_TAG
        # and only get rejected after the fact (see the check this used
        # to have here), breaking version resolution for every run until
        # someone finds and deletes it.
        LATEST_TAG="$(
          git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | head -n 1
        )"

        TYPE="${{ inputs.major-minor-patch }}"

        case "$TYPE" in
          major|minor|patch)
            ;;
          *)
            echo "Invalid version increment: $TYPE"
            echo "Expected: major, minor, or patch"
            exit 1
            ;;
        esac

        # This repo already has tags, so this branch isn't exercised
        # today, but it's a real, reachable case now (a fresh repo, or
        # this action reused elsewhere) - previously the strict-regex
        # check above ran before this and unconditionally rejected an
        # empty LATEST_TAG, so bootstrapping to v1.0.0 was unreachable.
        if [ -z "$LATEST_TAG" ]; then
          NEXT_TAG="v1.0.0"
          echo "No existing semantic version tags found."
          echo "NEXT_TAG=$NEXT_TAG" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "Current latest tag: $LATEST_TAG"

        VERSION="${LATEST_TAG#v}"

        IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

        case "$TYPE" in
          major)
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            ;;

          minor)
            MINOR=$((MINOR + 1))
            PATCH=0
            ;;

          patch)
            PATCH=$((PATCH + 1))
            ;;
        esac

        NEXT_TAG="v${MAJOR}.${MINOR}.${PATCH}"

        echo "Next tag: $NEXT_TAG"
        echo "NEXT_TAG=$NEXT_TAG" >> "$GITHUB_OUTPUT"
        echo "LATEST_TAG=$LATEST_TAG" >> "$GITHUB_OUTPUT"