name: "Slack Notify"
description: "Send a standardized Slack workflow notification"

inputs:
  status:
    description: "started, success, failure, or cancelled"
    required: true

  title:
    description: "Notification title"
    required: true

  message:
    description: "Optional additional message"
    required: false
    default: ""

  webhook:
    description: "Slack incoming webhook URL"
    required: true

runs:
  using: "composite"

  steps:
    - name: Resolve notification style
      id: style
      shell: bash
      run: |
        set -euo pipefail

        case "${{ inputs.status }}" in
          started)
            ICON=":rocket:"
            ;;
          success)
            ICON=":white_check_mark:"
            ;;
          failure)
            ICON=":x:"
            ;;
          cancelled)
            ICON=":warning:"
            ;;
          *)
            echo "Invalid Slack notification status: ${{ inputs.status }}"
            exit 1
            ;;
        esac

        echo "icon=$ICON" >> "$GITHUB_OUTPUT"

    - name: Send Slack notification
      uses: slackapi/slack-github-action@v4.0.0
      with:
        webhook: ${{ inputs.webhook }}
        webhook-type: incoming-webhook
        payload: |
          text: "${{ inputs.title }}"

          blocks:
            - type: "section"
              text:
                type: "mrkdwn"
                text: |
                  ${{ steps.style.outputs.icon }} *${{ inputs.title }}*

                  ${{ inputs.message }}

                  *Repository:* `${{ github.repository }}`
                  *Branch:* `${{ github.head_ref || github.ref_name }}`
                  *Actor:* `${{ github.actor }}`
                  *Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View GitHub Actions>