name: "Slack Notify"
description: "Send a standardized Slack workflow notification"

inputs:
  status:
    description: "started, success, failure, or cancelled"
    required: true

  title:
    description: "Notification title"
    required: true

  message:
    description: "Optional additional message"
    required: false
    default: ""

  webhook:
    description: "Slack webhook URL"
    required: true

runs:
  using: "composite"

  steps:
    # ============================================================
    # Resolve notification icon
    # ============================================================

    - name: Resolve notification style
      id: style
      shell: bash
      run: |
        set -euo pipefail

        case "${{ inputs.status }}" in
          started)
            ICON=":rocket:"
            ;;
          success)
            ICON=":white_check_mark:"
            ;;
          failure)
            ICON=":x:"
            ;;
          cancelled)
            ICON=":warning:"
            ;;
          *)
            echo "Invalid Slack notification status: ${{ inputs.status }}"
            exit 1
            ;;
        esac

        echo "icon=$ICON" >> "$GITHUB_OUTPUT"

    # ============================================================
    # Build Slack payload
    # ============================================================

    - name: Build Slack payload
      id: payload
      shell: bash
      env:
        ICON: ${{ steps.style.outputs.icon }}
        TITLE: ${{ inputs.title }}
        MESSAGE: ${{ inputs.message }}

        REPOSITORY: ${{ github.repository }}
        BRANCH: ${{ github.head_ref || github.ref_name }}
        ACTOR: ${{ github.actor }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      run: |
        set -euo pipefail

        BLOCK_TEXT="$(printf '%s *%s*\n\n%s\n\n*Repository:* `%s`\n*Branch:* `%s`\n*Actor:* `%s`\n*Run:* <%s|View GitHub Actions>' \
          "$ICON" \
          "$TITLE" \
          "$MESSAGE" \
          "$REPOSITORY" \
          "$BRANCH" \
          "$ACTOR" \
          "$RUN_URL"
        )"

        PAYLOAD="$(
          jq -cn \
            --arg title "$TITLE" \
            --arg text "$BLOCK_TEXT" \
            '{
              text: $title,
              blocks: [
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: $text
                  }
                }
              ]
            }'
        )"

        echo "payload=$PAYLOAD" >> "$GITHUB_OUTPUT"

    # ============================================================
    # Send notification
    # ============================================================

    - name: Send Slack notification
      uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d #v4.0.0
      with:
        webhook: ${{ inputs.webhook }}
        webhook-type: incoming-webhook
        payload: ${{ steps.payload.outputs.payload }}