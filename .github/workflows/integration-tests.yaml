name: Integration Tests

on:
  workflow_call:

jobs:
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-22.04

    env:
      # ============================================================
      # Application
      # ============================================================

      FLASK_ENV: ${{ vars.FLASK_ENV }}
      PORT: ${{ vars.PORT }}
      APP_VERSION: ${{ vars.APP_VERSION }}
      CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}

      # ============================================================
      # Database
      # ============================================================
      AUTO_CREATE_DB: true
      DB_NAME: ${{ vars.DB_NAME }}
      DB_USER_NAME: ${{ vars.DB_USER_NAME }}
      DB_SCHEME: ${{ vars.DB_SCHEME }}

      # ============================================================
      # Secrets
      # ============================================================

      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          sparse-checkout: |
            recipes-backend
            test
            .github
            nginx
            docker-compose.yaml

      # # ============================================================
      # # Integration Tests
      # # ============================================================

      # - name: Run Integration Tests
      #   run: |
      #     mkdir -p ./recipes-ui/dist/recipes-ui/browser
      #     docker compose -f docker-compose.yaml up \
      #       --build \
      #       --abort-on-container-exit \
      #       --exit-code-from integration-tests
# ============================================================
      # Set up Docker Buildx (Required for GHA Caching)
      # ============================================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ============================================================
      # Integration Tests with Caching Support
      # ============================================================

      - name: Run Integration Tests
        run: |
          mkdir -p ./recipes-ui/dist/recipes-ui/browser
          
          # Build explicitly via Buildx with GitHub Actions cache backend integration
          docker compose -f docker-compose.yaml build \
            --provenance=false \
            --build-arg BUILDKIT_INLINE_CACHE=1

          # Run the compose stack without rebuilding again
          docker compose -f docker-compose.yaml up \
            --abort-on-container-exit \
            --exit-code-from integration-tests

      # ============================================================
      # Cleanup
      # ============================================================

      - name: Teardown Environment
        if: ${{ always() }}
        run: |
          docker compose -f docker-compose.yaml down \
            --volumes \
            --remove-orphans
      # ============================================================
      # Cleanup
      # ============================================================

      - name: Teardown Environment
        if: ${{ always() }}
        run: |
          docker compose -f docker-compose.yaml down \
            --volumes \
            --remove-orphans