name: Integration Tests & Image Publish (on push to develop)

on:
  workflow_call:
    inputs:
      publish-image:
        description: "Whether to push the tested image to ECR"
        required: false
        type: boolean
        default: false

    outputs:
      image-tag:
        description: "Tag of the image published to ECR"
        value: ${{ jobs.integration-test.outputs.image-tag }}

      image-uri:
        description: "Full URI of the image published to ECR"
        value: ${{ jobs.integration-test.outputs.image-uri }}
jobs:
  integration-test:
    # Job name kept plain (not matching the workflow-level name above) -
    # image publishing only actually happens when called with
    # publish-image: true (push-to-develop-ci.yaml); the PR-to-develop
    # pipeline calls this same workflow for tests only, publish-image
    # defaults to false. See the "Publish tested image to ECR" step below.
    name: Integration Tests
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write

    outputs:
      image-tag: ${{ steps.resolve-tag.outputs.NEXT_TAG }}
      image-uri: ${{ steps.publish-image.outputs.image-uri }}
    env:
      # ============================================================
      # Application
      # ============================================================

      FLASK_ENV: ${{ vars.FLASK_ENV }}
      PORT: ${{ vars.PORT }}
      APP_VERSION: ${{ vars.APP_VERSION }}
      CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}

      # LOCAL_IMAGE is also passed to `docker compose` below (compose
      # substitutes it into docker-compose.yaml's `recipes-api.image:`) so
      # the stack reuses the image just built/loaded here instead of
      # rebuilding it from scratch.
      LOCAL_IMAGE: ${{ vars.LOCAL_IMAGE }}

      # ============================================================
      # Database
      # ============================================================
      AUTO_CREATE_DB: true
      DB_NAME: ${{ vars.DB_NAME }}
      DB_USER_NAME: ${{ vars.DB_USER_NAME }}
      DB_SCHEME: ${{ vars.DB_SCHEME }}

      # ============================================================
      # Secrets
      # ============================================================

      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      # Required separately from JWT_SECRET_KEY since config.py split them
      # into two independent secrets - missing here, the recipes-api
      # container fails at startup (get_required_env raises), so the
      # stack this step brings up would never become healthy.
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          sparse-checkout: |
            recipes-backend
            test
            .github
            nginx
            docker-compose.yaml

      # # ============================================================
      # # Integration Tests
      # # ============================================================

      # ============================================================
      # Set up Docker Buildx (Required for GHA Caching)
      # ============================================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Recipes API
        uses: docker/build-push-action@v7
        with:
          context: ./recipes-backend/recipes-api
          file: ./recipes-backend/recipes-api/Dockerfile
          load: true
          tags: ${{ vars.LOCAL_IMAGE }}

          cache-from: type=gha,scope=recipes-api
          cache-to: type=gha,mode=max,scope=recipes-api

      # ============================================================
      # Run the integration test suite
      # ============================================================
      # Brings up the full stack (postgres, recipes-api, nginx, and the
      # integration-tests runner from test/backend/) and blocks until the
      # integration-tests container exits, propagating its exit code -
      # a real test failure fails this step (and, since GitHub Actions
      # stops a job at its first failed step, everything after it: tag
      # resolution and the ECR publish below never run against untested
      # code). This step was previously entirely missing - the workflow
      # built an image and reported success without ever exercising it.
      - name: Run integration tests
        run: |
          docker compose -f docker-compose.yaml up \
            --abort-on-container-exit \
            --exit-code-from integration-tests

      # ============================================================
      # Cleanup
      # ============================================================

      - name: Teardown Environment
        if: ${{ always() }}
        run: |
          docker compose -f docker-compose.yaml down \
            --volumes \
            --remove-orphans

      # ============================================================
      # Optional: resolve tag and, tag image and push to ECR
      # ============================================================

      # ------------------------------------------------------------------------
      # Resolve semantic version
      # ------------------------------------------------------------------------

      - name: Resolve next version
        id: resolve-tag
        uses: ./.github/actions/resolve-tag
        with:
          major-minor-patch: patch


      - name: Validate image publishing inputs
        if: ${{ inputs.publish-image }}
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.resolve-tag.outputs.NEXT_TAG }}
          
        run: |
          set -euo pipefail

          if [ -z "$IMAGE_TAG" ]; then
            echo "::error::image-tag is required when publish-image=true"
            exit 1
          fi
      - name: Publish tested image to ECR
        if: ${{ inputs.publish-image }}
        id: publish-image
        uses: ./.github/actions/push-to-ecr
        with:
          local-image: ${{ vars.LOCAL_IMAGE }}
          image-tag: ${{ steps.resolve-tag.outputs.NEXT_TAG }}
          repository: ${{ vars.IMAGE_REPO_NAME }}
          aws-region: ${{ vars.IMAGE_REPO_REGION }}
          role-to-assume: ${{ vars.ECR_PUSH_ROLE_ARN }}