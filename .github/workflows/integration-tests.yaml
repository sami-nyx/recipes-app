name: Integration Test
on:
  workflow_call:

jobs:
  integration-test:
    runs-on: self-hosted
    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      with:
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /*
          !recipes-ui
    - name: List directory 
      run: ls -la   