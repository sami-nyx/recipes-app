name: CI pipeline

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request: 
    branches: [ "main" ]
jobs:
  # unit-tests:
  #   permissions:
  #     id-token: write  
  #     contents: read
  #   uses: ./.github/workflows/unit-tests.yaml
  integration-tests:
    permissions:
      id-token: write  
      contents: write
    # needs: [ 'unit-tests' ]
    uses: ./.github/workflows/integration-tests.yaml

  deploy:
    needs: ["integration-tests"]
    permissions:
      id-token: write  
      contents: write
    uses: ./.github/workflows/deploy.yaml
    secrets: inherit
    with:
      IMAGE_TAG: ${{ needs.integration-tests.outputs.resolved_tag }}