name: CI/CD pipeline

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request: 
    branches: [ "main" ]
jobs:
  unit-tests:
    permissions:
      id-token: write  # 👈 REQUIRED for GitHub OIDC tokens
      contents: read
    uses: ./.github/workflows/unit-tests.yaml
  integration-tests: 
    needs: [ 'unit-tests' ]
    uses: ./.github/workflows/integration-tests.yaml
    
