name: CI/CD pipeline

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request: 
    branches: [ "main" ]
jobs:
  # unit-tests:
  print-path:
    runs-on: ubuntu-latest
    steps:
      - name: Print Trigger Path
        run: |
          echo "=================================================="
          echo "Your custom format :"
          echo "${{ github.repository }}:${{ github.ref_name }}"
          echo "=================================================="
          echo "Breakdown of context variables:"
          echo "  Owner / Repo    : ${{ github.repository }}"
          echo "  Branch / Tag    : ${{ github.ref_name }}"
          echo "  Full Git Ref    : ${{ github.ref }}"
          echo "  Trigger Event   : ${{ github.event_name }}"
          echo "=================================================="
          echo "Exact AWS OIDC 'sub' claim format:"
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "  repo:${{ github.repository }}:pull_request"
          else
            echo "  repo:${{ github.repository }}:ref:${{ github.ref }}"
          fi
          
