name: Development Pipeline (push to develop)

on:
  push:
    branches:
      - develop

concurrency:
  group: recipes-api-develop
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
jobs:

  # ============================================================================
  # Slack - Pipeline Started
  # ============================================================================

  notify-start:
    name: Notify Slack - Started
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 #v6.1.0
        with:
          persist-credentials: false

      - name: Notify Slack
        uses: ./.github/actions/notify-slack
        with:
          status: started
          title: "Development pipeline started"
          # No "Branch: ..." line here - notify-slack's own payload
          # already appends one automatically, and it'd be identical to
          # this one (a single ref, no promotion path to add).
          message: |
            Commit: `${{ github.sha }}`
            Triggered by: `${{ github.actor }}`
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}


  # ============================================================================
  # Unit Tests
  # ============================================================================

  unit-tests:
    uses: ./.github/workflows/unit-tests.yaml


  # ============================================================================
  # Integration Test + ECR Publish
  # ============================================================================

  integration-test-and-publish:
    needs:
      - unit-tests

    # An explicit `if:` replaces GitHub Actions' default success() gate
    # entirely rather than ANDing with it - `needs.unit-tests.result ==
    # 'success'` has to be spelled out here, or a genuine test failure on
    # the side that changed would be silently ignored: the `changes`
    # sub-job still reports backend/frontend == 'true' regardless of
    # whether backend-tests/frontend-tests themselves passed, so without
    # this check a broken commit would still get integration-tested (and
    # potentially published).
    #
    # Runs whenever backend, frontend, OR the integration tier's own
    # topology/config changed - not backend alone. This is the only place
    # the UI's production build and nginx routing get exercised together,
    # so a frontend-only change still needs it; a docker-compose.yaml/
    # nginx/test-suite-only change needs it for the same reason, even
    # though it touches neither recipes-backend/ nor recipes-ui/.
    # Publishing is narrower than running, though: no point minting a new
    # recipes-api image/tag for a change that never touched the backend
    # itself - see `publish-image:` below.
    if: >-
      ${{
        needs.unit-tests.result == 'success' &&
        (
          needs.unit-tests.outputs.backend == 'true' ||
          needs.unit-tests.outputs.frontend == 'true' ||
          needs.unit-tests.outputs.integration == 'true'
        )
      }}

    permissions:
      contents: read
      id-token: write

    secrets: inherit

    uses: ./.github/workflows/integration-test.yaml
    with:
      publish-image: ${{ needs.unit-tests.outputs.backend == 'true' }}


  # ============================================================================
  # Verify ECR + Tag Git Commit
  # ============================================================================

  tag-commit:
    name: Verify ECR and Tag Commit

    needs:
      - integration-test-and-publish

    # Explicit rather than relying on default skip-cascades-through-needs
    # behavior: only verify/tag when a new image actually got published.
    # `result == 'success'` alone isn't enough to mean that anymore -
    # integration-test-and-publish now also succeeds on a frontend-only
    # change where publish-image was false, in which case image-tag comes
    # back empty (see integration-test.yaml: the tag-resolution/publish
    # steps are themselves gated on publish-image) - there'd be nothing
    # in ECR for this job to verify.
    if: ${{ needs.integration-test-and-publish.result == 'success' && needs.integration-test-and-publish.outputs.image-tag != '' }}

    runs-on: ubuntu-22.04

    permissions:
      contents: write
      id-token: write

    steps:

      # ------------------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 #v6.1.0
        with:
          fetch-depth: 0


      # ------------------------------------------------------------------------
      # AWS Authentication
      # ------------------------------------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c #v6.2.3
        with:
          role-to-assume: ${{ vars.ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          disable-retry: true


      # ------------------------------------------------------------------------
      # ECR Login
      # ------------------------------------------------------------------------

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd #v2.1.7


      # ------------------------------------------------------------------------
      # Verify Published Image
      # ------------------------------------------------------------------------

      - name: Verify Published Image in ECR
        id: verify-image
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.integration-test-and-publish.outputs.image-tag }}
          IMAGE_URI: ${{ needs.integration-test-and-publish.outputs.image-uri }}
          IMAGE_REPO: ${{ vars.IMAGE_REPO_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail

          if [ -z "$IMAGE_TAG" ]; then
            echo "::error::Reusable workflow did not return an image tag"
            exit 1
          fi

          if [ -z "$IMAGE_URI" ]; then
            echo "::error::Reusable workflow did not return an image URI"
            exit 1
          fi

          echo "Checking ECR for:"
          echo "  Repository: $IMAGE_REPO"
          echo "  Tag:        $IMAGE_TAG"
          echo "  URI:        $IMAGE_URI"

          IMAGE_DIGEST="$(
            aws ecr describe-images \
              --repository-name "$IMAGE_REPO" \
              --image-ids "imageTag=$IMAGE_TAG" \
              --region "$AWS_REGION" \
              --query 'imageDetails[0].imageDigest' \
              --output text
          )"

          if [ -z "$IMAGE_DIGEST" ] || [ "$IMAGE_DIGEST" = "None" ]; then
            echo "::error::Image $IMAGE_REPO:$IMAGE_TAG was not found in ECR"
            exit 1
          fi

          echo "Successfully verified image in ECR"
          echo "Tag:    $IMAGE_TAG"
          echo "Digest: $IMAGE_DIGEST"

          echo "image-digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"


      # ------------------------------------------------------------------------
      # Git Tag
      # ------------------------------------------------------------------------

      - name: Tag Current Commit
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.integration-test-and-publish.outputs.image-tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Tagging commit $GITHUB_SHA with $IMAGE_TAG"

          git tag "$IMAGE_TAG" "$GITHUB_SHA"
          git push origin "$IMAGE_TAG"


  # ============================================================================
  # Slack - Pipeline Finished
  # ============================================================================

  notify:
    name: Notify Slack - Finished
    runs-on: ubuntu-latest

    needs:
      - unit-tests
      - integration-test-and-publish
      - tag-commit

    if: ${{ always() }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 #v6.1.0
        with:
          persist-credentials: false

      - name: Resolve Workflow Result
        id: result
        shell: bash
        run: |
          # integration-test-and-publish/tag-commit legitimately read
          # "skipped" now when recipes-backend/recipes-api/ didn't change
          # (see that job's `if`) - that's a correct outcome, not a
          # failure, so it's accepted here alongside "success". Only an
          # actual "failure"/"cancelled" result should report the
          # pipeline as failed.
          if [[ \
            "${{ needs.unit-tests.result }}" == "success" &&
            "${{ needs.integration-test-and-publish.result }}" != "failure" &&
            "${{ needs.integration-test-and-publish.result }}" != "cancelled" &&
            "${{ needs.tag-commit.result }}" != "failure" &&
            "${{ needs.tag-commit.result }}" != "cancelled" \
          ]]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=Development pipeline succeeded" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=Development pipeline failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Slack
        uses: ./.github/actions/notify-slack
        with:
          status: ${{ steps.result.outputs.status }}
          title: ${{ steps.result.outputs.title }}
          message: |
            Commit: `${{ github.sha }}`

            Unit tests: `${{ needs.unit-tests.result }}`
            Integration test / ECR publish: `${{ needs.integration-test-and-publish.result }}`
            ECR verification / Git tag: `${{ needs.tag-commit.result }}`

            Image tag: `${{ needs.integration-test-and-publish.outputs.image-tag }}`
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ============================================================================
  # Create Pull Request: develop -> main
  # ============================================================================

  create-main-pr:
    name: Create PR to Main

    needs:
      - unit-tests
      - tag-commit
      - integration-test-and-publish

    # `always()` bypasses the default "skip if a needed job didn't
    # succeed" behavior - tag-commit/integration-test-and-publish read
    # "skipped" on a frontend-only (or integration-only) change (see that
    # job's `if`), and this job must still run in that case: the change
    # still needs to reach main. Explicitly still blocked by a genuine
    # failure, and by there being nothing at all to promote (nothing
    # changed - see recipes-ui-enhancements.md /
    # recipes-api-enhancements.md for why an empty release PR is skipped
    # rather than opened).
    #
    # needs.unit-tests.result == 'success' is required explicitly for the
    # same reason integration-test-and-publish now checks it: unit-tests
    # never has an `if` of its own (it always runs), so this is the only
    # signal that backend-tests/frontend-tests actually passed - without
    # it, a genuine test failure on the side that changed wouldn't stop
    # this job from still opening a release PR toward main.
    if: >-
      ${{
        always() &&
        needs.unit-tests.result == 'success' &&
        needs.tag-commit.result != 'failure' &&
        needs.tag-commit.result != 'cancelled' &&
        needs.integration-test-and-publish.result != 'failure' &&
        needs.integration-test-and-publish.result != 'cancelled' &&
        (
          needs.unit-tests.outputs.backend == 'true' ||
          needs.unit-tests.outputs.frontend == 'true' ||
          needs.unit-tests.outputs.integration == 'true'
        )
      }}

    runs-on: ubuntu-22.04

    permissions:
      contents: read
      pull-requests: write

    outputs:
      pr-url: ${{ steps.pr.outputs.pr-url }}
      pr-number: ${{ steps.pr.outputs.pr-number }}
      pr-status: ${{ steps.pr.outputs.pr-status }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 #v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create or Find Pull Request
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ needs.integration-test-and-publish.outputs.image-tag }}
          BACKEND_CHANGED: ${{ needs.unit-tests.outputs.backend }}
          FRONTEND_CHANGED: ${{ needs.unit-tests.outputs.frontend }}
          INTEGRATION_CHANGED: ${{ needs.unit-tests.outputs.integration }}
        run: |
          set -euo pipefail

          # No new image tag unless the backend itself changed - IMAGE_TAG
          # is empty otherwise (integration-test-and-publish's publish
          # step is gated on backend alone). Title/body describe what
          # actually changed instead of a blank tag.
          if [ "$BACKEND_CHANGED" = "true" ] && [ "$FRONTEND_CHANGED" = "true" ]; then
            CHANGE_SUMMARY="backend + frontend"
            PR_TITLE="Release ${IMAGE_TAG}"
          elif [ "$BACKEND_CHANGED" = "true" ]; then
            CHANGE_SUMMARY="backend only"
            PR_TITLE="Release ${IMAGE_TAG}"
          elif [ "$FRONTEND_CHANGED" = "true" ]; then
            CHANGE_SUMMARY="frontend only (no new recipes-api image)"
            PR_TITLE="Release: frontend"
          elif [ "$INTEGRATION_CHANGED" = "true" ]; then
            CHANGE_SUMMARY="integration/infra only - docker-compose.yaml, nginx, or the test tiers themselves (no new recipes-api image)"
            PR_TITLE="Release: infra"
          else
            # Unreachable given this job's own `if:` (backend, frontend, or
            # integration must be true for the job to run at all) - fail
            # loudly instead of silently minting a misleading title if
            # that guard is ever loosened without updating this too.
            echo "::error::None of backend/frontend/integration changed - this job should not have run"
            exit 1
          fi

          PR_BODY="$(cat <<EOF
          ## Automated release

          Development validation completed successfully.

          **Changes:** ${CHANGE_SUMMARY}
          **Image tag:** \`${IMAGE_TAG:-unchanged}\`
          **Source branch:** \`develop\`
          **Target branch:** \`main\`
          **Commit:** \`${GITHUB_SHA}\`

          This pull request is created and kept up to date automatically by the development pipeline.
          EOF
          )"

          # Check whether develop -> main PR already exists
          EXISTING_PR="$(
            gh pr list \
              --base main \
              --head develop \
              --state open \
              --json number,url \
              --jq '.[0] // empty'
          )"

          if [ -n "$EXISTING_PR" ]; then
            PR_NUMBER="$(echo "$EXISTING_PR" | jq -r '.number')"
            PR_URL="$(echo "$EXISTING_PR" | jq -r '.url')"

            echo "PR already exists:"
            echo "$PR_URL"

            # Only refresh title/body when THIS push actually published a
            # new image - on a frontend-only push IMAGE_TAG is empty, and
            # overwriting an already-correct "Release vX.Y.Z" title with
            # "Image tag: unchanged" would erase real information an
            # earlier push captured, trading one stale-PR problem for a
            # worse one. The PR's head is the develop branch itself, not
            # a pinned commit, so merging it always ships whatever's
            # actually on develop regardless of what the title says - this
            # only keeps the displayed tag from silently drifting behind
            # what a backend-changing push just published.
            if [ -n "$IMAGE_TAG" ]; then
              echo "New image tag this push ($IMAGE_TAG) - refreshing title/body"
              gh pr edit "$PR_NUMBER" \
                --title "$PR_TITLE" \
                --body "$PR_BODY"
            fi

            {
              echo "pr-number=$PR_NUMBER"
              echo "pr-url=$PR_URL"
              echo "pr-status=existing"
            } >> "$GITHUB_OUTPUT"

            exit 0
          fi

          PR_URL="$(
            gh pr create \
              --base main \
              --head develop \
              --title "$PR_TITLE" \
              --body "$PR_BODY"
          )"

          PR_NUMBER="$(
            gh pr view "$PR_URL" \
              --json number \
              --jq '.number'
          )"

          echo "Created PR #$PR_NUMBER"
          echo "$PR_URL"

          {
            echo "pr-number=$PR_NUMBER"
            echo "pr-url=$PR_URL"
            echo "pr-status=created"
          } >> "$GITHUB_OUTPUT"


  # ============================================================================
  # Slack - Pull Request Created
  # ============================================================================

  notify-main-pr:
    name: Notify Slack - Main PR

    needs:
      - create-main-pr
      - integration-test-and-publish

    runs-on: ubuntu-latest

    if: ${{ needs.create-main-pr.result == 'success' }}

    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 #v6.1.0
        with:
          persist-credentials: false

      - name: Notify Slack
        uses: ./.github/actions/notify-slack
        with:
          status: success
          title: "Release PR ready"
          # "Promotion:", not "Branch:" - notify-slack's own payload
          # already appends a "Branch:" line (just the current ref), so
          # reusing that label here for a *different* two-branch value
          # would show two differently-meaning "Branch:" lines in one
          # message.
          message: |
            PR: #${{ needs.create-main-pr.outputs.pr-number }}
            Promotion: `develop` → `main`
            Image: `${{ needs.integration-test-and-publish.outputs.image-tag || 'unchanged (frontend-only release)' }}`
            Status: `${{ needs.create-main-pr.outputs.pr-status }}`

            ${{ needs.create-main-pr.outputs.pr-url }}
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
