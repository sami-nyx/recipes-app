name: Development Pipeline (push to devlop)

on:
  push:
    branches:
      - main

concurrency:
  group: recipes-api-develop
  cancel-in-progress: false

jobs:

  # ============================================================================
  # Unit Tests
  # ============================================================================

  unit-tests:
    uses: ./.github/workflows/unit-tests.yaml


  # ============================================================================
  # Integration Tests
  # ============================================================================

  integration-tests-and-publish:
    
    permissions:
      contents: read
      id-token: write

    secrets: inherit
    needs:
      - unit-tests

    uses: ./.github/workflows/integration-tests.yaml
    with:
      publish-image: true




































































