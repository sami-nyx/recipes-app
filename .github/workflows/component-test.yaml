name: Component Test & Image Publish (on push to develop)

on:
  workflow_call:
    inputs:
      publish-image:
        description: "Whether to push the tested image to ECR"
        required: false
        type: boolean
        default: false

    outputs:
      image-tag:
        description: "Tag of the image published to ECR"
        value: ${{ jobs.component-test.outputs.image-tag }}

      image-uri:
        description: "Full URI of the image published to ECR"
        value: ${{ jobs.component-test.outputs.image-uri }}
jobs:
  component-test:
    # Job name kept plain (not matching the workflow-level name above) -
    # image publishing only actually happens when called with
    # publish-image: true (push-to-develop-ci.yaml); the PR-to-develop
    # pipeline calls this same workflow for tests only, publish-image
    # defaults to false. See the "Publish tested image to ECR" step below.
    #
    # "Component test": recipes-api validated against its own direct
    # dependency (postgres) only, via recipes-backend/recipes-api/
    # docker-compose.yaml - no nginx, no other application component.
    # Distinct from the (future) integration tier, which will exercise
    # multiple components together through the real system topology.
    name: Component Test
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write

    outputs:
      image-tag: ${{ steps.resolve-tag.outputs.NEXT_TAG }}
      image-uri: ${{ steps.publish-image.outputs.image-uri }}
    env:
      # ============================================================
      # Application
      # ============================================================

      FLASK_ENV: ${{ vars.FLASK_ENV }}
      PORT: ${{ vars.PORT }}
      APP_VERSION: ${{ vars.APP_VERSION }}
      CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}

      # LOCAL_IMAGE is also passed to `docker compose` below (compose
      # substitutes it into recipes-backend/recipes-api/docker-compose.yaml's
      # `recipes-api.image:`) so the stack reuses the image just
      # built/loaded here instead of rebuilding it from scratch.
      LOCAL_IMAGE: ${{ vars.LOCAL_IMAGE }}

      # ============================================================
      # Database
      # ============================================================
      DB_NAME: ${{ vars.DB_NAME }}
      DB_USER_NAME: ${{ vars.DB_USER_NAME }}
      DB_SCHEME: ${{ vars.DB_SCHEME }}

      # ============================================================
      # Secrets
      # ============================================================

      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      # Required separately from JWT_SECRET_KEY since config.py split them
      # into two independent secrets - missing here, the recipes-api
      # container fails at startup (get_required_env raises), so the
      # stack this step brings up would never become healthy.
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          clean: true
          sparse-checkout: |
            recipes-backend
            test
            .github

      # ============================================================
      # Set up Docker Buildx (Required for GHA Caching)
      # ============================================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e #v4.3.0

      - name: Build Recipes API
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a #v7.3.0
        with:
          context: ./recipes-backend/recipes-api
          file: ./recipes-backend/recipes-api/Dockerfile
          load: true
          tags: ${{ vars.LOCAL_IMAGE }}

          cache-from: type=gha,scope=recipes-api
          cache-to: type=gha,mode=max,scope=recipes-api

      # ============================================================
      # Run the component test suite
      # ============================================================
      # Brings up recipes-api's own compose stack (postgres, recipes-api,
      # and the component-test runner from test/component/ - no nginx,
      # no other component) and blocks until the component-test container
      # exits, propagating its exit code - a real test failure fails this
      # step (and, since GitHub Actions stops a job at its first failed
      # step, everything after it: tag resolution and the ECR publish
      # below never run against untested code).
      - name: Run component tests
        run: |
          docker compose -f recipes-backend/recipes-api/docker-compose.yaml up \
            --abort-on-container-exit \
            --exit-code-from component-test

      # ============================================================
      # Cleanup
      # ============================================================

      - name: Teardown Environment
        if: ${{ always() }}
        run: |
          docker compose -f recipes-backend/recipes-api/docker-compose.yaml down \
            --volumes \
            --remove-orphans

      # ============================================================
      # Optional: resolve tag and, tag image and push to ECR
      # ============================================================

      # ------------------------------------------------------------------------
      # Resolve semantic version
      # ------------------------------------------------------------------------

      - name: Resolve next version
        id: resolve-tag
        uses: ./.github/actions/resolve-tag
        with:
          major-minor-patch: patch


      - name: Validate image publishing inputs
        if: ${{ inputs.publish-image }}
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.resolve-tag.outputs.NEXT_TAG }}

        run: |
          set -euo pipefail

          if [ -z "$IMAGE_TAG" ]; then
            echo "::error::image-tag is required when publish-image=true"
            exit 1
          fi
      - name: Publish tested image to ECR
        if: ${{ inputs.publish-image }}
        id: publish-image
        uses: ./.github/actions/push-to-ecr
        with:
          local-image: ${{ vars.LOCAL_IMAGE }}
          image-tag: ${{ steps.resolve-tag.outputs.NEXT_TAG }}
          repository: ${{ vars.IMAGE_REPO_NAME }}
          aws-region: ${{ vars.IMAGE_REPO_REGION }}
          role-to-assume: ${{ vars.ECR_PUSH_ROLE_ARN }}
