name: Deploy
on:
  workflow_call:

jobs:
  deploy-web:
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::889867978066:role/gh-actions-eks-update-kube-config-role
          aws-region: ap-south-1
      
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
      
      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig --region ap-south-1 --name dakar-cluster
      - name: Deploy to EKS
        run: |
          kubectl get pods
  depoly-ui:  
    runs-on:  ubuntu-22.04
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: recipes-ui/
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          sparse-checkout: |
            recipes-ui/
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          node-version: '24.18.0'
          cache: 'npm'
          cache-dependency-path: recipes-ui/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::889867978066:role/gh-actions-s3-push-role
          aws-region: ap-south-1

      - name: build ui for prod
        run: |
          npx ng build --configuration production
      
      - name: deploy ui for prod
        run: |
          aws s3 sync dist/recipes-ui/browser s3://recipes-ui-static-hosting --delete
      
      - name: Invalidate CloudFront Cache
        env:
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"