name: Deploy
on:
  workflow_call:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::889867978066:role/gh-actions-eks-update-kube-config-role
          aws-region: ap-south-1
      
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
      
      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig --region ap-south-1 --name dakar-cluster
      - name: Deploy to EKS
        run: |
          kubectl get pods