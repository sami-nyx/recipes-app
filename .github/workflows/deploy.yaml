name: Deploy
on:
  workflow_call:

jobs:
  deploy-web:
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      contents: read
    steps:        
      - name: echo secret
        run: echo "$SECRET"
        env:
          SECRET: "${{ secrets.RECIPES_GITOPS_READ_WRITE_PAT }}"
  
      - name: Checkout GitOps repository
        uses: actions/checkout@v6
        with:
          repository: sami-nyx/recipes-gitops
          token: ${{ secrets.RECIPES_GITOPS_READ_WRITE_PAT }}
      
      - name: Ensure yq is installed
        run: |
          if ! command -v yq &> /dev/null; then
            echo "yq not found. Installing..."
            # Download the latest binary from GitHub releases
            sudo wget https://github.com -O /usr/local/bin/yq
            sudo chmod +x /usr/local/bin/yq
          else
            echo "yq is already installed at $(command -v yq)"
          fi
          
          # Print the version to confirm it works
          yq --version
      - name: Print current tag
        run: |
          echo "The tag that triggered this workflow is: ${{ github.ref_name }}"

