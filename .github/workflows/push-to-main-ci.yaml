name: Deploy Production

on:
  push:
    branches:
      - main

jobs:

  update-gitops:
    name: Update GitOps
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    outputs:
      image_tag: ${{ steps.resolve-tag.outputs.NEXT_TAG }}

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4 
        with:
          fetch-depth: 0     

      - name: Resolve image tag  
        id: resolve-tag
        uses: ./.github/actions/resolve-tag
        with:
          major-minor-patch: patch

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: sami-nyx/recipes-gitops
          token: ${{ secrets.RECIPES_GITOPS_READ_WRITE_PAT }}
          path: gitops
          fetch-depth: 0

      - name: Setup yq
        uses: mikefarah/yq@v4

      - name: Update recipes-api image tag
        working-directory: ./gitops
        env:
          IMAGE_TAG: ${{ steps.resolve-tag.outputs.NEXT_TAG }}
        run: |
          yq -i '.recipesApi.imageTag = strenv(IMAGE_TAG)' \
            apps/recipes-api/values.yaml

      - name: Commit GitOps change
        working-directory: ./gitops
        env:
          IMAGE_TAG: ${{ steps.resolve-tag.outputs.LATEST_TAG }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add apps/recipes-api/values.yaml

          if git diff --cached --quiet; then
            echo "GitOps repository already uses $IMAGE_TAG"
          else
            git commit -m "chore: deploy recipes-api ${IMAGE_TAG}"
            git push
          fi

      - name: Tag GitOps repository
        working-directory: ./gitops
        env:
          IMAGE_TAG: ${{ steps.resolve-tag.outputs.NEXT_TAG }}
        run: |
          if git rev-parse "$IMAGE_TAG" >/dev/null 2>&1; then
            echo "Tag $IMAGE_TAG already exists"
          else
            git tag "$IMAGE_TAG"
            git push origin "$IMAGE_TAG"
          fi
 

  deploy-ui:
    name: Deploy UI
    runs-on: ubuntu-24.04

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            recipes-ui

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: recipes-ui/package-lock.json

      - name: Install dependencies
        working-directory: recipes-ui
        run: npm ci

      - name: Build production UI
        working-directory: recipes-ui
        run: npm run build -- --configuration production

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::889867978066:role/gh-actions-s3-push-role
          aws-region: ap-south-1

      - name: Deploy UI to S3
        working-directory: recipes-ui
        run: |
          aws s3 sync \
            dist/recipes-ui/browser \
            s3://recipes-ui-static-hosting \
            --delete

      - name: Invalidate CloudFront cache
        env:
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"


  notify:
    name: Notify Slack
    runs-on: ubuntu-latest

    needs:
      - update-gitops
      - deploy-ui

    if: ${{ always() }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Notify success
        if: >-
          ${{
            needs.update-gitops.result == 'success' &&
            needs.deploy-ui.result == 'success'
          }}
        uses: ./.github/actions/slack-notify
        with:
          status: success
          title: "Production deployment succeeded"
          message: |
            GitOps update: `${{ needs.update-gitops.result }}`
            UI deployment: `${{ needs.deploy-ui.result }}`
            Branch: `main`
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify failure
        if: >-
          ${{
            needs.update-gitops.result != 'success' ||
            needs.deploy-ui.result != 'success'
          }}
        uses: ./.github/actions/slack-notify
        with:
          status: failure
          title: "Production deployment failed"
          message: |
            GitOps update: `${{ needs.update-gitops.result }}`
            UI deployment: `${{ needs.deploy-ui.result }}`
            Branch: `main` 
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}