name: Deploy Production

on:
  push:
    branches:
      - main

# update-gitops resolves "next version" from the latest git tag and then
# commits/pushes to a separate repo (recipes-gitops) - two concurrent runs
# could race on resolving and pushing that tag. Mirrors the guard already
# on push-to-develop-ci.yaml.
concurrency:
  group: recipes-main-deploy
  cancel-in-progress: false

jobs:

  # ============================================================================
  # Detect what actually changed in this push (not a test - pure change
  # detection - so this doesn't conflict with "no tests on main")
  # ============================================================================

  changes:
    name: Detect Changes
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      - name: Checkout Code Metadata
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4.4.0
        with:
          sparse-checkout: |
            .github

      - name: Check for File Changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 #v4.0.2
        with:
          filters: |
            backend:
              - 'recipes-backend/recipes-api/**'
            frontend:
              - 'recipes-ui/**'

  update-gitops:
    name: Update GitOps
    runs-on: ubuntu-24.04

    needs:
      - changes

    # Nothing under recipes-backend/recipes-api/ changed in what just
    # landed on main - the image GitOps already points at is still
    # exactly correct, so there's no new tag/image to promote.
    if: ${{ needs.changes.outputs.backend == 'true' }}

    permissions:
      contents: read

    # NOT NEXT_TAG - that's the version this job mints for the *GitOps
    # repo's own* tag below, unrelated to the app repo. LATEST_TAG is the
    # actual recipes-api image tag ("Update recipes-api image tag" step
    # writes this same value into apps/recipes-api/values.yaml) - the one
    # worth surfacing to a reader of this workflow's outputs, e.g. the
    # Slack notification below. This output was previously named
    # `image_tag` (inconsistent with every other output name in
    # .github/, which is kebab-case) and pointed at NEXT_TAG - unused
    # anywhere, and would have been misleading (a tag that doesn't
    # correspond to any recipes-api image) had anyone wired it up as-is.
    outputs:
      image-tag: ${{ steps.resolve-tag.outputs.LATEST_TAG }}

    steps:
      - name: Checkout application repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4.4.0
        with:
          fetch-depth: 0

      - name: Resolve image tag
        id: resolve-tag
        uses: ./.github/actions/resolve-tag
        with:
          major-minor-patch: patch


      - name: Checkout GitOps repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4.4.0
        with:
          repository: sami-nyx/recipes-gitops
          token: ${{ secrets.RECIPES_GITOPS_READ_WRITE_PAT }}
          path: gitops
          fetch-depth: 0

      - name: Setup yq
        uses: mikefarah/yq@c14f446382944492701b16c1ddb48bb9dbe683e3 #v4.53.6

      - name: Update recipes-api image tag
        working-directory: ./gitops
        env:
          IMAGE_TAG: ${{ steps.resolve-tag.outputs.LATEST_TAG }}
        run: |
          yq -i '.recipesApi.imageTag = strenv(IMAGE_TAG)' \
            apps/recipes-api/values.yaml

      - name: Commit GitOps change
        working-directory: ./gitops
        env:
          IMAGE_TAG: ${{ steps.resolve-tag.outputs.LATEST_TAG }}
        run: |
          echo "latest tag:$IMAGE_TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add apps/recipes-api/values.yaml

          if git diff --cached --quiet; then
            echo "GitOps repository already uses $IMAGE_TAG"
          else
            git commit -m "chore: deploy recipes-api ${IMAGE_TAG}"
            git push
          fi

      - name: Tag GitOps repository
        working-directory: ./gitops
        env:
          IMAGE_TAG: ${{ steps.resolve-tag.outputs.NEXT_TAG }}
        run: |
          if git rev-parse "$IMAGE_TAG" >/dev/null 2>&1; then
            echo "Tag $IMAGE_TAG already exists"
          else
            git tag "$IMAGE_TAG"
            git push origin "$IMAGE_TAG"
          fi


  deploy-ui:
    name: Deploy UI
    runs-on: ubuntu-24.04

    needs:
      - changes

    # Nothing under recipes-ui/ changed - the site already deployed to
    # S3/CloudFront is still exactly correct, so there's nothing new to
    # build or sync.
    if: ${{ needs.changes.outputs.frontend == 'true' }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout application repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4.4.0
        with:
          sparse-checkout: |
            recipes-ui

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 #v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: recipes-ui/package-lock.json

      - name: Install dependencies
        working-directory: recipes-ui
        run: npm ci

      - name: Build production UI
        working-directory: recipes-ui
        run: npm run build -- --configuration production

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c #v6.2.3
        with:
          role-to-assume: ${{ vars.S3_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy UI to S3
        working-directory: recipes-ui
        env:
          # Not a git tag: a frontend-only release mints no tag at all (see
          # tag-commit in push-to-develop-ci.yaml, gated on the backend
          # changing) - the "latest" tag at deploy time could be a stale
          # backend release with no relation to the UI code going out.
          # GITHUB_SHA is always the exact commit actually deployed.
          GIT_COMMIT: ${{ github.sha }}
        run: |
          aws s3 sync \
            dist/recipes-ui/browser \
            s3://recipes-ui-static-hosting \
            --delete \
            --metadata "git-commit=$GIT_COMMIT"

      - name: Invalidate CloudFront cache
        env:
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"
  notify:
    name: Notify Slack
    runs-on: ubuntu-latest

    needs:
      - update-gitops
      - deploy-ui

    if: ${{ always() }}

    steps:
      - name: Checkout local action directory
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4.4.0
        with:
          sparse-checkout: |
            .github/actions/notify-slack

      # update-gitops/deploy-ui legitimately read "skipped" now when their
      # respective paths didn't change (see each job's `if`) - that's a
      # correct outcome, not a failure, so both steps below treat
      # "success" and "skipped" the same way and only react to an actual
      # "failure"/"cancelled" result.
      - name: Notify success
        if: >-
          ${{
            needs.update-gitops.result != 'failure' &&
            needs.update-gitops.result != 'cancelled' &&
            needs.deploy-ui.result != 'failure' &&
            needs.deploy-ui.result != 'cancelled'
          }}
        uses: ./.github/actions/notify-slack
        with:
          status: success
          title: "Production deployment succeeded"
          # No "Branch: ..." line here - notify-slack's own payload
          # already appends one automatically, and it'd be identical to
          # this one (always `main`, this workflow only triggers there).
          message: |
            GitOps update: `${{ needs.update-gitops.result }}`
            UI deployment: `${{ needs.deploy-ui.result }}`
            Image tag: `${{ needs.update-gitops.outputs.image-tag || 'unchanged (frontend-only deploy)' }}`
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify failure
        if: >-
          ${{
            needs.update-gitops.result == 'failure' ||
            needs.update-gitops.result == 'cancelled' ||
            needs.deploy-ui.result == 'failure' ||
            needs.deploy-ui.result == 'cancelled'
          }}
        uses: ./.github/actions/notify-slack
        with:
          status: failure
          title: "Production deployment failed"
          message: |
            GitOps update: `${{ needs.update-gitops.result }}`
            UI deployment: `${{ needs.deploy-ui.result }}`
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
