name: Develop CI (pull request to develop)

on:
  pull_request:
    branches:
      - develop


permissions:
  contents: read
  id-token: write
  pull-requests: read
jobs: 
  notify-start:
    name: Notify Slack - Started 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 #v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Notify Slack
        uses: ./.github/actions/notify-slack
        with:
          status: started
          title: "PR validation started"
          # "Promotion:", not "Branch:" - notify-slack's own payload
          # already appends a "Branch:" line (just the PR's head ref), so
          # reusing that label here for a *different* two-branch value
          # would show two differently-meaning "Branch:" lines in one
          # message.
          message: |
            PR: #${{ github.event.pull_request.number }}
            Promotion: `${{ github.head_ref || github.ref_name }}` → `develop`
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}


  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions: 
      contents: read
      statuses: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 #v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0


  #     - name: Run Super-Linter
  #       uses: super-linter/super-linter@v8.7.0
  #       env:
  #         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  #         VALIDATE_ALL_CODEBASE: false
  #         FIX_MODE_ENABLED: false

  #         VALIDATE_PYTHON_FLAKE8: true
  #         VALIDATE_DOCKERFILE_HADOLINT: true
  #         VALIDATE_YAML: true
  #         VALIDATE_GITHUB_ACTIONS: true
  #         VALIDATE_BASH: true

  #         SAVE_SUPER_LINTER_SUMMARY: true
  unit-tests:
    
    permissions:
      contents: read
      pull-requests: read
      
    uses: ./.github/workflows/unit-tests.yaml

  component-test:
    needs:
      # - lint
      - unit-tests

    uses: ./.github/workflows/component-test.yaml

    secrets: inherit  
  notify:
    name: Notify Slack - Finished
    runs-on: ubuntu-latest

    needs:
      # - lint
      - unit-tests
      - component-test

    if: ${{ always() }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 #v6.1.0
        with:
          persist-credentials: false

      - name: Resolve workflow result
        id: result
        shell: bash
        run: |
          # lint deliberately excluded: it's not in this job's `needs`
          # above (its actual check is commented out - see the `lint`
          # job), so `needs.lint.result` isn't populated in this context
          # and always evaluates to empty. Referencing it here previously
          # meant this condition was never true - the Slack summary
          # always reported "PR validation failed" regardless of the
          # real outcome.
          if [[ \
            "${{ needs.unit-tests.result }}" == "success" &&
            "${{ needs.component-test.result }}" == "success" \
          ]]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=PR validation succeeded" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=PR validation failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Slack
        uses: ./.github/actions/notify-slack
        with:
          status: ${{ steps.result.outputs.status }}
          title: ${{ steps.result.outputs.title }}
          message: |
            PR: #${{ github.event.pull_request.number }}
            Promotion: `${{ github.head_ref || github.ref_name }}` → `develop`

            Unit tests: `${{ needs.unit-tests.result }}`
            Component test: `${{ needs.component-test.result }}`
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}