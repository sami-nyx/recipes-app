name: Develop CI (pull request to develop)

on:
  pull_request:
    branches:
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-start:
    name: Notify Slack - Started
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Notify Slack
        uses: ./.github/actions/slack-notify
        with:
          status: started
          title: "PR validation started"
          message: |
            PR: #${{ github.event.pull_request.number }}
            Branch: `${{ github.head_ref || github.ref_name }}` → `develop`
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'workflow_dispatch' }}
      - name: Run Super-Linter
        uses: super-linter/super-linter@v8.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          FIX_MODE_ENABLED: false

  unit-tests:
    uses: ./.github/workflows/unit-tests.yaml

  integration-tests:
    needs:
      - lint
      - unit-tests
    uses: ./.github/workflows/integration-tests.yaml

  notify:
    name: Notify Slack - Finished
    runs-on: ubuntu-latest

    needs:
      - lint
      - unit-tests
      - integration-tests

    if: ${{ always() }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve workflow result
        id: result
        shell: bash
        run: |
          if [[ \
            "${{ needs.lint.result }}" == "success" &&
            "${{ needs.unit-tests.result }}" == "success" &&
            "${{ needs.integration-tests.result }}" == "success" \
          ]]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=PR validation succeeded" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=PR validation failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Slack
        uses: ./.github/actions/slack-notify
        with:
          status: ${{ steps.result.outputs.status }}
          title: ${{ steps.result.outputs.title }}
          message: |
            PR: #${{ github.event.pull_request.number }}
            Branch: `${{ github.head_ref || github.ref_name }}` → `develop`

            Lint: `${{ needs.lint.result }}`
            Unit tests: `${{ needs.unit-tests.result }}`
            Integration tests: `${{ needs.integration-tests.result }}`
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}