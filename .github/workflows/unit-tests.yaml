name: Unit Test
on:
  workflow_call:
    outputs:
      backend:
        description: "Whether recipes-backend/recipes-api/** changed"
        value: ${{ jobs.changes.outputs.backend }}
      frontend:
        description: "Whether recipes-ui/** changed"
        value: ${{ jobs.changes.outputs.frontend }}
      integration:
        description: "Whether the integration-test tier's own topology/config changed (docker-compose.yaml, nginx/**, test/component/**, or the component/integration-test workflows and shared actions themselves)"
        value: ${{ jobs.changes.outputs.integration }}

jobs:
  changes:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      integration: ${{ steps.filter.outputs.integration }}
    steps:
      - name: Checkout Code Metadata
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4.4.0
        with:
          sparse-checkout: |
            .github

      - name: Check for File Changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 #v4.0.2
        with:
          filters: |
            backend:
              - 'recipes-backend/recipes-api/**'
            frontend:
              - 'recipes-ui/**'
            # Nothing under recipes-backend/ or recipes-ui/ - this is what
            # the integration tier actually exercises beyond those two: the
            # stack topology, nginx routing, and the shared pytest suite
            # both component-test and integration-test run. Without this,
            # a docker-compose.yaml/nginx.conf/test-suite-only change (or
            # an edit to the tier workflows themselves) matched neither
            # `backend` nor `frontend`, so push-to-develop-ci.yaml's
            # integration-test-and-publish never ran it, and
            # create-main-pr never opened a PR to promote it - such a
            # change could merge to develop and then sit there
            # indefinitely, untested and unpromoted.
            integration:
              - 'docker-compose.yaml'
              - 'nginx/**'
              - 'test/component/**'
              - '.github/workflows/component-test.yaml'
              - '.github/workflows/integration-test.yaml'
              - '.github/actions/**'

  # --------------------------------------------------
  # Job 2: Python Backend Tests (Runs conditionally)
  # --------------------------------------------------
  backend-tests:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-24.04
    
    defaults:
      run:
        working-directory: recipes-backend/recipes-api/

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          sparse-checkout: |
            recipes-backend/recipes-api/
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: recipes-backend/recipes-api/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        env:
          FLASK_ENV: "testing"
        run: |
          python -m unittest discover -s tests

  # --------------------------------------------------
  # Job 3: Angular UI Tests (Runs ONLY if recipes-ui changed)
  # --------------------------------------------------
  frontend-tests:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: recipes-ui/

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          sparse-checkout: |
            recipes-ui/
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          node-version: '24.18.0'
          cache: 'npm'
          cache-dependency-path: recipes-ui/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci

      # `ng build` doesn't run a single spec - this step name previously
      # claimed to run tests while actually just building the app, so
      # Angular's test suite never executed in CI at all. The project uses
      # Angular's Vitest-based unit-test builder (angular.json's "test"
      # target), which runs component specs against jsdom by default -
      # there's no Karma/Chrome involved despite the old step name.
      - name: Run Angular Tests
        run: |
          npx ng test --watch=false