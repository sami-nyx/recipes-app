name: Unit Test
on:
  workflow_call:

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      # Lightweight checkout: fetching only the Git history metadata needed for diffing, not the files themselves
      - name: Checkout Code Metadata
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github

      - name: Check for File Changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 #v4.0.2
        with:
          filters: |
            backend:
              - 'recipes-backend/recipes-api/**'
            frontend:
              - 'recipes-ui/**'

    # --------------------------------------------------
    # Job 2: Python Backend Tests (Runs conditionally)
    # --------------------------------------------------
  backend-tests:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-24.04
    
    defaults:
      run:
        working-directory: recipes-backend/recipes-api/

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          sparse-checkout: |
            recipes-backend/recipes-api/
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: recipes-backend/recipes-api/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        env:
          PYTHONPATH: .
        run: |
          pytest

  # --------------------------------------------------
  # Job 3: Angular UI Tests (Runs ONLY if recipes-ui changed)
  # --------------------------------------------------
  frontend-tests:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: recipes-ui/

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          sparse-checkout: |
            recipes-ui/
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          node-version: '24.18.0'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: |
          npm ci

      - name: Run Angular Tests (Headless Chrome)
        run: |
          ng build --configuration development