<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header class="card-header">
      <mat-card-title>Welcome Back</mat-card-title>
      <mat-card-subtitle>Sign in to your Recipes account</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content class="mt-4">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <!-- Username / Email Field -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Username or Email</mat-label>
          <input
            matInput
            formControlName="usernameOrEmail"
            placeholder="Enter username or email"
            autocomplete="username"
          />
          <mat-icon matPrefix>person</mat-icon>
          @if (loginForm.controls.usernameOrEmail.hasError('required')) {
            <mat-error>Username or Email is required</mat-error>
          }
        </mat-form-field>

        <!-- Password Field -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input
            matInput
            [type]="hidePassword() ? 'password' : 'text'"
            formControlName="password"
            placeholder="Enter your password"
            autocomplete="current-password"
          />
          <mat-icon matPrefix>lock</mat-icon>
          <button
            type="button"
            mat-icon-button
            matSuffix
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="'Hide password'"
            [attr.aria-pressed]="hidePassword()"
          >
            <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          @if (loginForm.controls.password.hasError('required')) {
            <mat-error>Password is required</mat-error>
          }
        </mat-form-field>

        <!-- Submit Button -->
        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="submit-button full-width"
          [disabled]="isLoading()"
        >
          @if (isLoading()) {
            <mat-spinner diameter="24" class="spinner-inline"></mat-spinner>
          } @else {
            Sign In
          }
        </button>
      </form>
    </mat-card-content>

    <mat-card-footer class="card-footer">
      <p>Don't have an account? <a routerLink="/register" class="link">Sign up</a></p>
    </mat-card-footer>
  </mat-card>
</div>
