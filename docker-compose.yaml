services:
  postgres:
    image: postgres:16-alpine
    container_name: recipes_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER_NAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  recipes-api:
    build:
      context: ./recipes-backend/recipes-api
      dockerfile: Dockerfile
    container_name: recipes_api
    restart: always
    environment:
      FLASK_ENV: ${FLASK_ENV}
      DB_NAME: ${DB_NAME}
      DB_USER_NAME: ${DB_USER_NAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SECRET_KEY: ${SECRET_KEY}
    ports:
      - "5001:5000"
    depends_on:
      postgres:
        condition: service_healthy  

volumes:
  postgres_data: