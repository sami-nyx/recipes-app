# Why nginx is here at all: it doesn't rehearse anything about how this
# app actually ships. Production serves the UI from S3 + CloudFront and
# routes recipes-api through a Kubernetes Ingress (see
# recipes-cluster-resources/apps/recipes-api/templates/ingress.yaml) -
# neither one is this container or this nginx.conf. What it's actually
# for:
#   - One origin locally. `docker compose up` gives you http://localhost
#     serving both the built Angular app and /api//system, instead of
#     two different ports/origins - avoids CORS complexity in local dev
#     and lets you click around the app the way a real visitor would hit
#     one domain.
#   - Something for tests to actually route through. It's what makes
#     "does proxying/routing work" a testable question at all, separate
#     from "does recipes-api's own logic work" (see test/component/ vs.
#     the future integration tier).
# If either of those stops being true, there's no other reason to keep
# it - it's not a production stand-in.

services:
  postgres:
    image: postgres:16-alpine
    container_name: recipes_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - db_network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER_NAME} -d ${DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  recipes-api:
    # `image:` alongside `build:`: if an image already exists under this
    # tag (e.g. CI pre-built and `docker load`ed it via buildx, tagging it
    # ${LOCAL_IMAGE}), compose reuses it as-is instead of rebuilding - so
    # the image integration tests run against is guaranteed to be the
    # exact one that gets published, not a coincidentally-similar rebuild.
    # Local dev is unaffected: LOCAL_IMAGE is unset, so this just falls
    # back to `recipes-api:local`, which doesn't exist yet on a fresh
    # machine - compose builds it normally and tags it that name.
    image: ${LOCAL_IMAGE:-recipes-api:local}
    build:
      context: ./recipes-backend/recipes-api
      dockerfile: Dockerfile

      cache_from:
        - type=gha,scope=recipes-api

      cache_to:
        - type=gha,mode=max,scope=recipes-api

    command: ["python", "app.py"]

    container_name: recipes_api
    restart: unless-stopped

    environment:
      FLASK_ENV: ${FLASK_ENV}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SECRET_KEY: ${SECRET_KEY}
      PORT: ${PORT}
      APP_VERSION: ${APP_VERSION}
      CORS_ORIGIN: ${CORS_ORIGIN}

      DB_NAME: ${DB_NAME}
      DB_USER_NAME: ${DB_USER_NAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_SCHEME: ${DB_SCHEME}
      DB_PORT: 5432

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - app_network
      - db_network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/system/health')\" || exit 1"
        ]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 5s


  # One-shot: builds the Angular app and exits. Not a long-running
  # service like recipes-api/nginx - `depends_on: condition:
  # service_completed_successfully` below is what makes that distinction
  # matter (nginx waits for this to *finish*, not just start).
  #
  # Same build recipes-ui actually ships with: `npm ci && npm run build
  # -- --configuration production` mirrors push-to-main-ci.yaml's
  # deploy-ui job exactly, so what you preview locally is built the same
  # way as what reaches S3, not a coincidentally-similar dev build.
  #
  # Bind-mounts ./recipes-ui itself (not a copy) so the build's output
  # lands directly at ./recipes-ui/dist/recipes-ui/browser on the host -
  # nginx's existing mount below already points there, unchanged. The
  # extra `/app/node_modules` volume is the standard fix for bind-mounting
  # a JS project into a container: without it, `npm ci` would install
  # into the bind-mounted host tree, and native deps built for the
  # container's Linux/arch could conflict with whatever's already in
  # ./recipes-ui/node_modules from running npm on the host directly.
  recipes-ui-build:
    image: node:24-alpine
    working_dir: /app

    volumes:
      - ./recipes-ui:/app
      - recipes_ui_node_modules:/app/node_modules

    command: sh -c "npm ci && npm run build -- --configuration production"


  nginx:
    image: nginx:1.29-alpine
    container_name: recipes_nginx
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./recipes-ui/dist/recipes-ui/browser:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/50x.html:/usr/share/nginx/errors/50x.html:ro

    depends_on:
      recipes-api:
        condition: service_healthy
      recipes-ui-build:
        condition: service_completed_successfully

    networks:
      - app_network


  integration-tests:
    build:
      context: ./test/backend/
      dockerfile: Dockerfile

      cache_from:
        - type=gha,scope=integration-tests

      cache_to:
        - type=gha,mode=max,scope=integration-tests

    environment:
      API_BASE_URL: http://nginx

    depends_on:
      nginx:
        condition: service_started

    networks:
      - app_network


volumes:
  postgres_data:
  recipes_ui_node_modules:


networks:
  app_network:
    driver: bridge

  db_network:
    driver: bridge