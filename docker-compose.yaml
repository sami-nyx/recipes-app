# Why nginx is here at all: it doesn't rehearse anything about how this
# app actually ships. Production serves the UI from S3 + CloudFront and
# routes recipes-api through a Kubernetes Ingress (see
# recipes-cluster-resources/apps/recipes-api/templates/ingress.yaml) -
# neither one is this container or this nginx.conf. What it's actually
# for:
#   - One origin locally. `docker compose up` gives you http://localhost
#     serving both the built Angular app and /api//system, instead of
#     two different ports/origins - avoids CORS complexity in local dev
#     and lets you click around the app the way a real visitor would hit
#     one domain.
#   - Something for tests to actually route through. It's what makes
#     "does proxying/routing work" a testable question at all, separate
#     from "does recipes-api's own logic work" (see test/component/ vs.
#     the future integration tier).
# If either of those stops being true, there's no other reason to keep
# it - it's not a production stand-in.

services:
  postgres:
    image: postgres:16-alpine
    container_name: recipes_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - db_network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER_NAME} -d ${DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  recipes-api:
    # `image:` alongside `build:`: if an image already exists under this
    # tag (e.g. CI pre-built and `docker load`ed it via buildx, tagging it
    # ${LOCAL_IMAGE}), compose reuses it as-is instead of rebuilding - so
    # the image integration tests run against is guaranteed to be the
    # exact one that gets published, not a coincidentally-similar rebuild.
    # Local dev is unaffected: LOCAL_IMAGE is unset, so this just falls
    # back to `recipes-api:local`, which doesn't exist yet on a fresh
    # machine - compose builds it normally and tags it that name.
    image: ${LOCAL_IMAGE:-recipes-api:local}
    build:
      context: ./recipes-backend/recipes-api
      dockerfile: Dockerfile

      cache_from:
        - type=gha,scope=recipes-api

      cache_to:
        - type=gha,mode=max,scope=recipes-api

    command: ["python", "app.py"]

    container_name: recipes_api
    restart: unless-stopped

    environment:
      FLASK_ENV: ${FLASK_ENV}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SECRET_KEY: ${SECRET_KEY}
      PORT: ${PORT}
      APP_VERSION: ${APP_VERSION}
      CORS_ORIGIN: ${CORS_ORIGIN}

      DB_NAME: ${DB_NAME}
      DB_USER_NAME: ${DB_USER_NAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_SCHEME: ${DB_SCHEME}
      DB_PORT: 5432

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - app_network
      - db_network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/system/health')\" || exit 1"
        ]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 5s


  # One-shot: builds the Angular app and exits. Not a long-running
  # service like recipes-api/nginx - `depends_on: condition:
  # service_completed_successfully` below (on nginx) is what makes that
  # distinction matter: nginx waits for this to *finish*, not just start.
  #
  # A real `build:` (not a bind-mount + inline command) so `npm ci` is
  # its own Docker layer, cached the same way recipes-api's build already
  # is (cache_from/cache_to type=gha) - editing application code alone
  # doesn't force a full reinstall on every `docker compose up`.
  #
  # nginx stays the plain, stock nginx:1.29-alpine image below - it
  # doesn't know or care how the UI was built. The hand-off is explicit:
  # this container's own command copies its baked-in build output
  # (recipes-ui/Dockerfile's RUN npm run build already produced it, as
  # an image layer) into the shared `rendered_spa_content` volume, which
  # nginx then mounts read-only. `rm -rf` first so a rebuild can't leave
  # stale files (a renamed/removed asset from a previous build) sitting
  # in the volume alongside the new ones.
  recipes-ui-build:
    image: ${LOCAL_UI_IMAGE:-recipes-ui:local}
    build:
      context: ./recipes-ui
      dockerfile: Dockerfile

      cache_from:
        - type=gha,scope=recipes-ui

      cache_to:
        - type=gha,mode=max,scope=recipes-ui

    volumes:
      - rendered_spa_content:/output

    command: sh -c "rm -rf /output/* && cp -r /app/dist/recipes-ui/browser/. /output/"


  nginx:
    image: nginx:1.29-alpine
    container_name: recipes_nginx
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - rendered_spa_content:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/50x.html:/usr/share/nginx/errors/50x.html:ro

    depends_on:
      recipes-api:
        condition: service_healthy
      recipes-ui-build:
        condition: service_completed_successfully

    networks:
      - app_network


  # This is the whole-system stack (nginx + recipes-api + this
  # test-runner, going through nginx) - the future integration tier, once
  # there's a second component to actually integrate with. Same
  # test/component/ Dockerfile and pytest suite the component tier uses
  # (conftest.py reads its target from API_BASE_URL, not hardcoded), just
  # pointed at nginx instead of recipes-api directly. Not yet wired into
  # any CI workflow - the component tier is (see
  # .github/workflows/component-test.yaml); this one is next.
  integration-tests:
    build:
      context: ./test/component/
      dockerfile: Dockerfile

      cache_from:
        - type=gha,scope=integration-tests

      cache_to:
        - type=gha,mode=max,scope=integration-tests

    environment:
      API_BASE_URL: http://nginx

    depends_on:
      nginx:
        condition: service_started

    networks:
      - app_network


volumes:
  postgres_data:
  rendered_spa_content:


networks:
  app_network:
    driver: bridge

  db_network:
    driver: bridge