name: Build and Publish

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  build-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Your existing test/build/version/ECR steps go here
      # ...

      - name: Create or update release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Look for an existing open PR from develop -> main.
          EXISTING_PR=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --base main \
            --head develop \
            --json number \
            --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
            echo "Release PR already exists: #$EXISTING_PR"
            echo "New commits on develop are automatically included in it."

            gh pr comment "$EXISTING_PR" \
              --repo "$GITHUB_REPOSITORY" \
              --body "Develop has been updated. A new artifact was successfully built and published. This release PR now includes the latest develop changes."

          else
            echo "No release PR exists. Creating one..."

            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head develop \
              --title "Release: develop → main" \
              --body "$(cat <<'EOF'
          ## Release candidate

          This pull request promotes the current `develop` branch to `main`.

          The develop pipeline has successfully:

          - Passed unit tests
          - Passed integration tests
          - Built the application
          - Created the release artifact
          - Published the artifact to ECR

          A human review is required before merging this release into `main`.

          After merging, the main branch pipeline will promote the approved artifact to the GitOps repository.
          EOF
          )"
          fi