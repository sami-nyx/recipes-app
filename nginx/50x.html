<head>

  <title>Service Unavailable</title>

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafafa;

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

    }
    .card {
      max-width: 420px;
      padding: 2rem;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 0.75rem;
