server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;


    location / {
        try_files $uri $uri/ /index.html;
    }

location ~ ^/(api|system)/ {
    proxy_pass http://recipes-api:5000;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

    # 502/504: recipes-api is down or not responding in time. Without
    # this, a proxy failure falls through to nginx's bare built-in error
    # page instead of something that at least tells a human what's going
    # on. Served from its own mount (see docker-compose.yaml), not the
    # `root` above - that directory is entirely recipes-ui's build
    # output (read-only), and a read-only bind mount can't host a second,
    # separately-mounted file nested inside it.
    error_page 502 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/errors;
        internal;
    }
}