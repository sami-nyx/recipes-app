  services:
    postgres:
      image: postgres:16-alpine
      container_name: recipes_postgres
      restart: always

      environment:
        POSTGRES_DB: ${DB_NAME}
        POSTGRES_USER: ${DB_USER_NAME}
        POSTGRES_PASSWORD: ${DB_PASSWORD}

      volumes:
        - postgres_data:/var/lib/postgresql/data

      networks:
        - db_network

      healthcheck:
        test:
          [
            "CMD-SHELL",
            "pg_isready -U ${DB_USER_NAME} -d ${DB_NAME}"
          ]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 10s
    db-init:
      build:
        context: ./recipes-backend/recipes-api
        dockerfile: Dockerfile

      environment:
        FLASK_ENV: ${FLASK_ENV}
        JWT_SECRET_KEY: ${JWT_SECRET_KEY}
        PORT: ${PORT}
        APP_VERSION: ${APP_VERSION}
        CORS_ORIGIN: ${CORS_ORIGIN}

        DB_NAME: ${DB_NAME}
        DB_USER_NAME: ${DB_USER_NAME}
        DB_PASSWORD: ${DB_PASSWORD}
        DB_HOST: postgres
        DB_SCHEME: ${DB_SCHEME}
        DB_PORT: 5432

      command:
        - python
        - -c
        - |
          from app import create_app
          from models.user import db

          app = create_app()

          with app.app_context():
              db.create_all()
              print("Database schema created successfully")

      depends_on:
        postgres:
          condition: service_healthy

      networks:
        - db_network

    recipes-api:
      build:
        context: ./recipes-backend/recipes-api
        dockerfile: Dockerfile

      container_name: recipes_api
      restart: always

      environment:
        FLASK_ENV: ${FLASK_ENV}
        JWT_SECRET_KEY: ${JWT_SECRET_KEY}
        PORT: ${PORT}
        APP_VERSION: ${APP_VERSION}
        CORS_ORIGIN: ${CORS_ORIGIN}
        DB_NAME: ${DB_NAME}
        DB_USER_NAME: ${DB_USER_NAME}
        DB_PASSWORD: ${DB_PASSWORD}
        DB_HOST: postgres
        DB_SCHEME: ${DB_SCHEME}
        DB_PORT: 5432

        
      depends_on:
        postgres:
          condition: service_healthy
        db_init:
          condition: service_completed_successfully


      networks:
        - app_network
        - db_network

      healthcheck:
        test:
          [
            "CMD-SHELL",
            "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/system/health')\" || exit 1"
          ]
        interval: 5s
        timeout: 10s
        retries: 5
        start_period: 5s


    nginx:
      image: nginx:1.29-alpine
      container_name: recipes_nginx
      restart: always

      ports:
        - "80:80"

      volumes:
        - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

      depends_on:
        recipes-api:
          condition: service_healthy

      networks:
        - app_network


    integration-tests:
      build:
        context: ./test/backend/
        dockerfile: Dockerfile

      environment:
        API_BASE_URL: http://recipes-api:5000

      depends_on:
        recipes-api:
          condition: service_healthy

      networks:
        - app_network


  volumes:
    postgres_data:

  networks:
    app_network:
      driver: bridge
    db_network:
      driver: bridge